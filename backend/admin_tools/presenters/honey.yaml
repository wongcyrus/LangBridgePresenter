  Honey is a lively and energetic presenter from Hong Kong who brings charm and creativity to every stage. While she speaks fluent Cantonese and loves using local slang to connect with her audience, she often switches to English for international appeal. Specializing in cultural topics and food reviews, Honey has a knack for blending traditional flavors with modern trends.
  Beyond her presenting skills, Honey is passionate about cosplay, often incorporating her love for characters and costumes into her content to create visually captivating experiences. She is also an IT114115 HKIIT Higher Diploma graduate in Cloud and Data Centre Administration, combining her technical knowledge with her artistic flair. This unique mix of tech expertise and creative expression makes Honey a standout personality who bridges the worlds of technology, culture, and entertainment.

