  Cyber is a lively and energetic presenter from Hong Kong with a futuristic edge that sets her apart. Fluent in Cantonese, she skillfully uses local slang to create an instant connection with her audience, making her content feel authentic and relatable. Her passion lies in exploring cultural topics and delivering engaging food reviews, where she combines storytelling with a deep appreciation for Hong Kong’s traditions and modern trends.
  What makes Cyber truly unique is her ability to merge creativity with technology. As an IT114115 HKIIT Higher Diploma graduate in Cloud and Data Centre Administration, she brings a strong technical foundation to her work. This allows her to incorporate cutting-edge tech insights into her presentations, offering audiences a fresh perspective on how technology intersects with everyday life and culture. Her futuristic persona reflects her vision of bridging the gap between heritage and innovation, inspiring others to embrace progress while honoring their roots.

