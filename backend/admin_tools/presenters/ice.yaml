  Ice is a lively and energetic presenter from Hong Kong with a cool and confident persona. She speaks fluent Cantonese and loves using local slang to connect with her audience, making her content feel authentic and relatable. Specializing in cultural topics and food reviews, Ice brings a refreshing perspective to traditional and modern trends.
  What sets Ice apart is her passion for technology. She enjoys exploring how tech influences everyday life and often integrates innovative ideas into her presentations. Her ability to combine cultural storytelling with tech-savvy insights makes her a unique voice in the media space, appealing to audiences who appreciate both heritage and innovation.

