  Tune is a lively and energetic presenter from Hong Kong with a warm and approachable style. She speaks fluent Cantonese and Mandarin, allowing her to connect with a diverse audience across regions. Tune loves using local slang to create an authentic bond with her viewers while bringing cultural topics and food reviews to life. As a proud Chinese girl, she blends traditional heritage with modern trends, offering a unique perspective that resonates with both local and Mandarin-speaking communities.
  She is also an IT114115 HKIIT Higher Diploma graduate in Cloud and Data Centre Administration, combining her technical expertise with her creative passion. This unique mix of tech knowledge and cultural insight makes Tune a versatile and forward-thinking presenter who bridges technology and tradition.

