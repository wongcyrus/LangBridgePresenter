[pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --tb=short
    --disable-warnings
testpaths =
    .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Integration tests that require deployed backend
    unit: Unit tests that can run without external dependencies
    slow: Tests that take a long time to run
    admin: Tests for admin tools functionality
timeout = 60
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
